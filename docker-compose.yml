services:
  postgres_auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres_workout:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: workoutdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata_workout:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d workoutdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === НОВЫЙ БЛОК: База данных для аналитики ===
  postgres_analytics:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: analyticsdb
    ports:
      - "5434:5432"   # Наружу пробрасываем на 5434, чтобы не конфликтовать
    volumes:
      - pgdata_analytics:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analyticsdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://admin:secret@postgres_auth:5432/authdb?sslmode=disable"
      JWT_SECRET: "my-super-secret-key" # ...env 
      HTTP_PORT: "8080"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "72h"
    depends_on:
      postgres_auth:
        condition: service_healthy

  workout:
    build:
      context: .
      dockerfile: services/workout/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: "postgres://admin:secret@postgres_workout:5432/workoutdb?sslmode=disable"
      JWT_SECRET: "my-super-secret-key"
      HTTP_PORT: "8081"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres_workout:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === НОВЫЙ БЛОК: Сервис аналитики ===
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: "postgres://admin:secret@postgres_analytics:5432/analyticsdb?sslmode=disable"
      JWT_SECRET: "my-super-secret-key"
      HTTP_PORT: "8082"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres_analytics:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres_planner:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: plannerdb
    ports:
      - "5435:5432"
    volumes:
      - pgdata_planner:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d plannerdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  planner:
    build:
      context: .
      dockerfile: services/planner/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "postgres://admin:secret@postgres_planner:5432/plannerdb?sslmode=disable"
      JWT_SECRET: "my-super-secret-key"
      HTTP_PORT: "8083"
      REDIS_ADDR: "redis:6379"
    depends_on:
      postgres_planner:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      REDIS_ADDR: "redis:6379"
      PLANNER_BASE_URL: "http://planner:8083"
      INTERNAL_TOKEN: "dev-secret-token"
    depends_on:
      - redis
      - planner

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    command:
      - "--config.file=/config/blackbox.yml"
    depends_on:
      - workout
  
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - blackbox-exporter
  
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
    - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
    secrets:
      - telegram_bot_token
      - telegram_chat_id
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

volumes:
  pgdata_auth:
  pgdata_workout:
  pgdata_analytics:
  pgdata_planner:
  redisdata:
  prometheus_data:
  grafana_data:


secrets:
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN

  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID