version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://admin:secret@postgres:5432/authdb?sslmode=disable"
      JWT_SECRET: "my-super-secret-key"
      HTTP_PORT: "8080"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "72h"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: