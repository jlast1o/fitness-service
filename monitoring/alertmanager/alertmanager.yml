global:

route:
  receiver: default

  group_by:
    - alertname
    - service

  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

  routes:
    - matchers:
        - severity="critical"
      receiver: critical

    - matchers:
        - severity="warning"
      receiver: warning


receivers:
  - name: default

  - name: critical

  - name: warning


inhibit_rules:
  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - service