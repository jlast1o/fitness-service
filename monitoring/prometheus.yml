global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"
          
  - job_name: "services"
    metrics_path: /metrics

    static_configs:
      - targets:
          - "auth:8080"
        labels:
          service: "auth"

      - targets:
          - "workout:8081"
        labels:
          service: "workout"

      - targets:
          - "analytics:8082"
        labels:
          service: "analytics"

      - targets:
          - "planner:8083"
        labels:
          service: "planner"

  - job_name: "blackbox-live"
    metrics_path: /probe

    params:
      module:
        - http_2xx

    scrape_interval: 15s
    scrape_timeout: 10s

    static_configs:
      - targets:
          - "http://auth:8080/health/live"
        labels:
          service: "auth"

      - targets:
          - "http://workout:8081/health/live"
        labels:
          service: "workout"

      - targets:
          - "http://analytics:8082/health/live"
        labels:
          service: "analytics"

      - targets:
          - "http://planner:8083/health/live"
        labels:
          service: "planner"

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  - job_name: "blackbox-ready"
    metrics_path: /probe

    params:
      module:
        - http_2xx

    scrape_interval: 15s
    scrape_timeout: 10s

    static_configs:
      - targets:
          - "http://auth:8080/health/ready"
        labels:
          service: "auth"

      - targets:
          - "http://workout:8081/health/ready"
        labels:
          service: "workout"

      - targets:
          - "http://analytics:8082/health/ready"
        labels:
          service: "analytics"

      - targets:
          - "http://planner:8083/health/ready"
        labels:
          service: "planner"

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: "blackbox-exporter:9115"

