groups:
  - name: service-health
    rules:
      # =========================================================
      # AVAILABILITY
      # =========================================================

      - alert: ServiceDown
        expr: probe_success{job="blackbox-live"} == 0
        for: 30s

        labels:
          severity: critical

        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Liveness probe for {{ $labels.service }} has been failing for more than 30 seconds."


      - alert: ServiceNotReady
        expr: |
          probe_success{job="blackbox-ready"} == 0
          and on(service)
          probe_success{job="blackbox-live"} == 1
        for: 1m

        labels:
          severity: warning

        annotations:
          summary: "Service {{ $labels.service }} is not ready"
          description: "Service {{ $labels.service }} is alive but its readiness probe has been failing for more than 1 minute."


      # =========================================================
      # HTTP ERRORS
      # =========================================================

      - alert: High5xxErrorRate
        expr: |
          (
            sum by (service) (
              rate(
                http_requests_total{
                  status_code=~"5.."
                }[2m]
              )
            )
            /
            sum by (service) (
              rate(
                http_requests_total[2m]
              )
            )
          ) > 0.05
          and
          sum by (service) (
            rate(
              http_requests_total[2m]
            )
          ) > 0.1

        for: 1m

        labels:
          severity: warning

        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "More than 5% of HTTP requests to {{ $labels.service }} have returned 5xx responses for more than 1 minute."


      # =========================================================
      # HTTP LATENCY
      # =========================================================

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (
              rate(
                http_request_duration_seconds_bucket[5m]
              )
            )
          ) > 1
          and
          sum by (service) (
            rate(
              http_requests_total[5m]
            )
          ) > 0.1

        for: 1m

        labels:
          severity: warning

        annotations:
          summary: "High HTTP latency on {{ $labels.service }}"
          description: "p95 HTTP latency for {{ $labels.service }} has been above 1 second for more than 1 minute."


      # =========================================================
      # METRICS PIPELINE
      # =========================================================

      - alert: MetricsTargetDown
        expr: up{job="services"} == 0
        for: 1m

        labels:
          severity: warning

        annotations:
          summary: "Prometheus cannot scrape {{ $labels.service }}"
          description: "Prometheus has been unable to scrape /metrics from {{ $labels.service }} for more than 1 minute."